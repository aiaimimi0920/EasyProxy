# ═══════════════════════════════════════════════════════════════
# Easy Proxies 完整配置文件
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# 运行模式
# ───────────────────────────────────────────────────────────────
# pool: 单端口代理池，所有节点共享一个端口，自动负载均衡
# multi-port: 多端口模式，每个节点独立端口
# hybrid: 混合模式，同时启用 pool + multi-port
mode: pool

# 日志级别: debug, info, warn, error
log_level: info

# 全局跳过 SSL 证书验证（默认 false，不建议在生产环境启用）
skip_cert_verify: false

# 最终目标域名使用经代理节点转发的加密 DNS，节点服务器自身仍使用本地 DNS。
dns:
  enabled: true
  remote_servers:
    - https://cloudflare-dns.com/dns-query
  detour: proxy-pool
  strategy: prefer_ipv4

# 外部 IP 地址，用于导出配置时替换 0.0.0.0（可选）
# external_ip: "your.public.ip"

# SQLite 数据库文件路径（默认 data/data.db，相对于配置文件目录）
# 用于存储节点数据、运行时统计、会话等
# database_path: "data/data.db"

# ───────────────────────────────────────────────────────────────
# 监听配置（Pool 模式入口）
# ───────────────────────────────────────────────────────────────
listener:
  address: 0.0.0.0      # 监听地址
  port: 22323           # 监听端口（单仓迁移默认值，避开旧工作区）
  protocol: http        # 监听协议: http | socks5 | mixed
  username: username    # 代理认证用户名
  password: password    # 代理认证密码

# ───────────────────────────────────────────────────────────────
# 代理池配置
# ───────────────────────────────────────────────────────────────
pool:
  # 调度模式: auto（健康优先自动策略）, sequential（顺序轮询）, random（随机选择）, balance（最小连接数负载均衡）
  mode: auto
  # 连续失败多少次后加入黑名单
  failure_threshold: 3
  # 黑名单持续时间
  blacklist_duration: 24h

# ───────────────────────────────────────────────────────────────
# 多端口模式配置（multi-port / hybrid 模式使用）
# ───────────────────────────────────────────────────────────────
multi_port:
  address: 0.0.0.0      # 监听地址
  base_port: 25000      # 起始端口号（单仓迁移默认值，避开旧工作区）
  protocol: http        # 监听协议: http | socks5 | mixed
  username: mpuser      # 默认认证用户名
  password: mppass      # 默认认证密码

# ───────────────────────────────────────────────────────────────
# 管理面板配置
# ───────────────────────────────────────────────────────────────
management:
  enabled: true                                      # 是否启用管理面板
  listen: 127.0.0.1:29888                            # 默认仅本机；绑定局域网地址必须配置非空密码
  probe_target: https://www.google.com/generate_204  # 健康检查目标
  health_check_interval: 2h                          # 周期健康检查间隔（默认 2 小时）
  password: ""                                      # WebUI/API 密码；Local Server 启用时由 canonical auth 同步

# Canonical Local Server is opt-in. When enabled, use mode: pool,
# listener.protocol: mixed, and replace the placeholder with one shared secret.
local_server:
  enabled: false
  listen: ""
  auth:
    username: easyproxy
    password: change_me_to_a_strong_shared_password

# ───────────────────────────────────────────────────────────────
# GeoIP 地域分区配置（默认开启，可显式关闭）
# ───────────────────────────────────────────────────────────────
# 启用后，节点会按地域自动分组，可通过路径访问特定地域的代理池：
#   http://127.0.0.1:22323/jp    - 日本节点
#   http://127.0.0.1:22323/kr    - 韩国节点
#   http://127.0.0.1:22323/us    - 美国节点
#   http://127.0.0.1:22323/hk    - 香港节点
#   http://127.0.0.1:22323/tw    - 台湾节点
#   http://127.0.0.1:22323/sg    - 新加坡节点
#   http://127.0.0.1:22323/other - 其他地域
#   http://127.0.0.1:22323/      - 全部节点（默认）
geoip:
  enabled: true                                      # 默认启用 GeoIP 地域分区
  database_path: "./GeoLite2-Country.mmdb"           # GeoIP 数据库路径（首次启动时自动下载）
  auto_update_enabled: true                          # 是否启用自动更新数据库（推荐）
  auto_update_interval: 24h                          # 自动更新间隔（默认 24 小时）
  # listen: 0.0.0.0                                  # GeoIP 路由监听地址（默认使用 listener 配置）
  # port: 22323                                      # GeoIP 路由监听端口（默认 22323）
  # 注意：
  #   - 首次启动会自动从 GitHub 下载 GeoIP 数据库（约 9MB）
  #   - 启用 auto_update_enabled 后，数据库会定期自动更新，无需重启容器
  #   - 更新过程采用热重载，不会中断现有连接

# ───────────────────────────────────────────────────────────────
# 智能分流入口 routing（可选，默认关闭）
# ───────────────────────────────────────────────────────────────
# 启用后，dispatcher 接管默认代理入口（listener 的 host:port），提供：
#   1) 按规则分流：根据访问目标判定 直连(DIRECT) / 走代理池(PROXY)，规则语法与
#      Clash/mihomo 基本一致
#   2) 选节点策略：默认入口（系统代理、无参数）走 stable。新绑定优先长效节点；
#      暂无长效节点时回退到任意健康节点，已有健康绑定不会因节点刚变成长效而漂移
#   3) API 调用可传参覆盖：CONNECT/HTTP 路径令牌、X-Proxy-* 头或 SOCKS5 用户名令牌
#
# 不启用时（enabled: false）运行时行为与旧版完全一致：裸 pool 入口服务所有流量、
# 不做任何分流。
#
# routing:
#   enabled: false                 # 总开关；true 时 dispatcher 接管 listener 入口
#   # listen: "0.0.0.0:22323"      # 留空 = 接管 listener 的 host:port
#   default_strategy: stable       # 默认入口策略：stable / session / auto（默认 stable）
#   use_default_rules: true        # 是否附加内置“中国直连”默认规则集（默认 true）
#   final_policy: PROXY            # 无规则命中时的兜底：PROXY / DIRECT（默认 PROXY）
#   rules:                         # 自定义规则，优先级高于默认集，按顺序匹配
#     - "DOMAIN-SUFFIX,example.com,DIRECT"
#     - "DOMAIN-KEYWORD,google,PROXY"
#     - "IP-CIDR,203.0.113.0/24,DIRECT"
#     - "GEOIP,CN,DIRECT"          # 仅对“目标本身已是 IP”的请求生效
#   rule_files:                    # 相对路径以主 config.yaml 所在目录为基准
#     - "rules/flclash-import.yaml"
#   rule_providers:                # 远程规则集（社区域名列表等），定时刷新
#     - url: "https://example.com/china-direct.txt"
#       policy: DIRECT
#       behavior: domain           # domain（每行一个域名）/ classical（每行 TYPE,value）
#       interval: 24h
#   long_lived:                    # “长效节点”判定阈值（stable 防封号用）
#     min_uptime: 2h               # 持续在线时长达标（默认 2h）
#     min_success_rate: 0.9        # 成功率达标（默认 0.9）
#   session:
#     ttl: 10m                     # session 策略的会话粘性空闲过期（默认 10m）
#
# API 传参速查（仅在 routing.enabled 时生效）：
#   路径前缀:  CONNECT stable+us/example.com:443
#              GET http://代理/session+sid=job42/...
#     令牌:    auto|stable|session  jp|kr|us|hk|tw|other  cc=US  long|nolong
#              pin=<节点tag>  sid=<会话key>  split|nosplit
#   HTTP 头:   X-Proxy-Strategy / X-Proxy-Country / X-Proxy-Region /
#              X-Proxy-Long-Lived / X-Proxy-Pin / X-Proxy-Session / X-Proxy-Split
#   SOCKS5:    用 username 字段承载令牌，语法与路径前缀完全一致（行业惯例）。
#              入口端口同时支持 HTTP/HTTPS CONNECT 与 SOCKS5（按首字节自动识别）。
#              例: socks5h://stable+us+sid=job42@代理:22323
#                  username = "stable+us+sid=job42"  （+ 之后即令牌串）
#              鉴权: 配了 listener.password 时，SOCKS 的 password 必须匹配；
#                    username 的首段（+ 之前）比对 listener.username，
#                    之后为令牌。未配鉴权时 username 纯作令牌用。
#   说明:      X-Proxy-Split: off / nosplit 令牌  → 关闭分流、全程走代理（爬虫常用）
#              session 未显式给 sid 时，按客户端来源 IP 兜底保持会话粘性
#   可观测:    GET /api/routing/status  查看规则数 / 默认策略 / 当前粘性绑定

# ───────────────────────────────────────────────────────────────
# 原生透明网关 gateway（Linux/NAS，默认关闭）
# ───────────────────────────────────────────────────────────────
# 启用后由宿主机/网络命名空间的 TPROXY 规则把可信 LAN/虚拟局域网流量
# 送入 EasyProxy。接口名只是示例，不能假设 tailscale0 或任意产品名一定存在。
#
# gateway:
#   enabled: false
#   mode: transparent
#   listen: 0.0.0.0:15001
#   ingress:
#     interfaces: [eth0, tailscale0, xingkong0]
#     interface_patterns: [ts-*, star-*]
#     trusted_cidrs: [192.168.15.0/24, 100.64.0.0/10, 10.66.0.0/16]
#   capture:
#     tcp: tproxy
#     udp: disabled                 # Phase 2
#     preserve_original_destination: true
#   routing:
#     final_policy: PROXY
#     no_available_proxy_policy: DIRECT  # fail-open，节点池为空仍可直连
#   dns:
#     enabled: false                # DNS/DoH/DoT 边界见透明网关文档
#     listen: 0.0.0.0:53
#   tun:                            # mode: tun 时生效；与 TPROXY capture 互斥
#     interface_name: easyproxy0
#     addresses: [172.31.255.1/30, "fd31:255::1/126"]
#     stack: mixed                  # system / gvisor / mixed
#     mtu: 1500                     # 1280-9000
#     ipv4: true
#     ipv6: false                   # 部署具备完整 IPv6 转发/出口后再启用
#     udp: true
#     strict_route: true
#     dns_hijack: false             # true 要求 gateway.dns.enabled: true
#     fake_ip: false
#     fake_ipv4_range: 198.18.0.0/16
#     fake_ipv6_range: "fc00::/18"
#   devices:
#     laptop:
#       addresses: [192.168.15.100, 100.64.0.20, 10.66.0.20]

# ───────────────────────────────────────────────────────────────
# 订阅自动刷新配置（可选）
# ───────────────────────────────────────────────────────────────
# subscription_refresh:
#   enabled: false              # 是否启用定时刷新
#   interval: 24h               # 刷新间隔（默认 24 小时）
#   timeout: 30s                # 获取订阅的超时时间
#   health_check_timeout: 60s   # 新节点健康检查超时
#   drain_timeout: 30s          # 旧实例排空超时时间
#   min_available_nodes: 1      # 最少可用节点数，低于此值不切换

# ───────────────────────────────────────────────────────────────
# Source Sync（可选）
# ───────────────────────────────────────────────────────────────
# 用于从 MiSub 拉取统一 manifest，并在 manifest 不可用时启用 aggregator 回退订阅。
# local 优先级最高：本地 subscriptions / nodes / WebUI 手动节点始终保留。
# source_sync:
#   enabled: false
#   manifest_url: "https://misub.example.com/api/manifest/profile-id"
#   manifest_token: "replace-with-manifest-token"
#   refresh_interval: 1h
#   request_timeout: 15s
#   default_direct_proxy_scheme: http   # 裸 residential 输入默认补成 http://
#   fallback_subscriptions:
#     - "https://r2.example.com/fallback-profile.txt"
#   connector_runtime:
#     enabled: true
#     binary_path: ""                   # 留空时自动从 PATH 查找 ech-workers / ech-win
#     working_directory: ""             # 留空时默认使用 <config-dir>/data/connectors
#     listen_host: 127.0.0.1
#     listen_start_port: 30000
#     startup_timeout: 10s

# connector 说明：
# - manifest 中 kind=connector、connector_type=ech_worker 的来源会被本地拉起为 ech-workers 进程
# - kind=connector、connector_type=zenproxy_client 的来源会在运行时请求 ZenProxy /api/client/fetch
# - 每个 connector 会被转换成本地 socks5://127.0.0.1:<port> 或 http://127.0.0.1:<port> 上游，
#   或转换成临时 proxy URI 节点
# - 这些上游属于运行时临时来源，不会写回持久化本地节点库

# ═══════════════════════════════════════════════════════════════
# 节点配置方式（三选一或混合使用）
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# 方式 1: 订阅链接（推荐，自动获取并写入 nodes.txt）
# ───────────────────────────────────────────────────────────────
subscriptions:
  - "https://example.com/subscribe?token=xxx"
#   - "https://another.com/api/v1/client/subscribe?token=yyy"

# ───────────────────────────────────────────────────────────────
# 方式 2: 节点文件（每行一个代理 URI）
# ───────────────────────────────────────────────────────────────
# nodes_file: nodes.txt

# ───────────────────────────────────────────────────────────────
# 方式 3: 直接在配置文件中配置节点
# ───────────────────────────────────────────────────────────────
# nodes:
  # 最简配置：只需 URI，名称从 # 后自动提取
  # - uri: "vless://uuid@server:443?security=tls&type=ws&path=/path#节点名称"

  # 完整配置：手动指定名称和端口
  # - name: "自定义名称"
  #   uri: "ss://base64@server:8388"
  #   port: 24001              # 手动指定端口（multi-port/hybrid 模式）
  #   username: "custom_user"  # 覆盖默认认证（可选）
  #   password: "custom_pass"

# ───────────────────────────────────────────────────────────────
# 支持的代理协议
# ───────────────────────────────────────────────────────────────
# - VMess:    vmess://base64_encoded_json
# - VLESS:    vless://uuid@server:port?params#name
# - Trojan:   trojan://password@server:port?params#name
# - SS:       ss://method:password@server:port#name
#             ss://base64(method:password)@server:port#name
# - SSR:      ssr://base64_encoded
# - Hysteria2: hy2://password@server:port?params#name
# - HTTP:     http://user:pass@server:port
# - SOCKS5:   socks5://user:pass@server:port

name: Reusable Validate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

'on':
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Repository
    runs-on: windows-latest

    steps:
      - name: Checkout repository recursively
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: service/base/go.mod
          cache-dependency-path: |
            service/base/go.sum
            tools/easyproxyctl/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            upstreams/misub/package-lock.json
            service/base/frontend/package-lock.json

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML tqdm requests boto3 websockets

      - name: Validate topology and lifecycle CLI
        shell: pwsh
        run: |
          python -m json.tool topology.schema.json > $null
          Push-Location tools/easyproxyctl
          try {
            go test -count=1 ./...
            go vet ./...
            go run ./cmd/easyproxyctl topology validate --file ../../topology.example.yaml
          }
          finally {
            Pop-Location
          }

      - name: Run root script smoke tests
        shell: pwsh
        run: |
          python -m unittest discover -s "tests" -p "test_*.py" -v

      - name: Run aggregator regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s "upstreams/aggregator/tests" -p "test_*.py" -v

      - name: Install MiSub test dependencies
        shell: pwsh
        working-directory: upstreams/misub
        run: npm ci

      - name: Run MiSub unit tests
        shell: pwsh
        working-directory: upstreams/misub
        run: npm run test:run

      - name: Run all service/base Go tests
        shell: pwsh
        working-directory: service/base
        run: go test -count=1 ./...

      - name: Check Go formatting
        shell: pwsh
        run: |
          python scripts/check-go-format.py service/base/cmd service/base/internal tools/easyproxyctl

      - name: Check effective-line ratchet
        shell: pwsh
        run: python scripts/check-effective-lines.py

      - name: Vet service/base Go packages
        shell: pwsh
        working-directory: service/base
        run: go vet ./...

      - name: Install service/base frontend dependencies
        shell: pwsh
        working-directory: service/base/frontend
        run: npm ci

      - name: Test service/base frontend
        shell: pwsh
        working-directory: service/base/frontend
        run: npm run test

      - name: Lint service/base frontend
        shell: pwsh
        working-directory: service/base/frontend
        run: npm run lint

      - name: Build service/base frontend
        shell: pwsh
        working-directory: service/base/frontend
        run: npm run build

      - name: Validate release contract
        shell: pwsh
        run: python scripts/validate-release-contract.py

      - name: Check generated assets and git diff
        shell: pwsh
        run: |
          git diff --check
          git diff --exit-code

name: Validate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-regressions:
    name: Smoke And Regressions
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: service/base/go.mod
          cache-dependency-path: service/base/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            upstreams/misub/package-lock.json
            service/base/frontend/package-lock.json

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML tqdm requests

      - name: Run root script smoke tests
        shell: pwsh
        run: |
          python -m unittest discover -s "tests" -p "test_*.py" -v

      - name: Run aggregator regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s "upstreams/aggregator/tests" -p "test_*.py" -v

      - name: Install MiSub test dependencies
        shell: pwsh
        working-directory: upstreams/misub
        run: |
          npm ci

      - name: Run MiSub unit tests
        shell: pwsh
        working-directory: upstreams/misub
        run: |
          npm run test:run

      - name: Run all service/base Go tests
        shell: pwsh
        working-directory: service/base
        run: |
          go test -count=1 ./...

      - name: Install service/base frontend dependencies
        shell: pwsh
        working-directory: service/base/frontend
        run: |
          npm ci

      - name: Lint service/base frontend
        shell: pwsh
        working-directory: service/base/frontend
        run: |
          npm run lint

      - name: Build service/base frontend
        shell: pwsh
        working-directory: service/base/frontend
        run: |
          npm run build

      - name: Validate Release Contract
        shell: pwsh
        run: |
          python scripts/validate-release-contract.py

      - name: Check git diff formatting
        shell: pwsh
        run: |
          git diff --check

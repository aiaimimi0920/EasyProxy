name: Inspect Cloudflare Resources

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: List D1 database names
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || {
            echo "::error::Cloudflare credentials are required"
            exit 1
          }
          output="${RUNNER_TEMP}/d1-databases.json"
          npx --yes wrangler@4.56.0 d1 list --json > "$output"
          python - "$output" <<'PY'
          import json
          import sys

          databases = json.load(open(sys.argv[1], encoding="utf-8"))
          names = sorted(
              item.get("name", "").strip()
              for item in databases
              if item.get("name", "").strip()
          )
          if not names:
              raise SystemExit("No D1 databases were found")
          for name in names:
              print(f"D1 database name: {name}")
          PY

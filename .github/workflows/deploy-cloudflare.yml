name: Deploy Cloudflare Apps

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

'on':
  workflow_dispatch:
    inputs:
      target:
        description: Which Cloudflare target to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - misub-pages
          - ech-workers-cloudflare
          - aggregator-seed-relay
      deployment_mode:
        description: Bootstrap missing resources or update existing resources
        required: true
        default: update
        type: choice
        options:
          - bootstrap
          - update
      misub_branch:
        description: Branch name recorded for the MiSub Pages deployment
        required: false
        default: main
        type: string
      misub_project_name:
        description: MiSub Cloudflare Pages project name
        required: false
        default: misub-git
        type: string
      run_verification:
        description: Verify the deployed Cloudflare targets after publish
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  deployments: write

jobs:
  preflight:
    name: Deploy preflight validation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: upstreams/ech-workers/go.mod
          cache-dependency-path: |
            service/base/go.sum
            tools/easyproxyctl/go.sum
            upstreams/ech-workers/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstreams/misub/package-lock.json

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run root script smoke tests
        shell: pwsh
        run: |
          python -m unittest discover -s "tests" -p "test_*.py" -v

      - name: Run ECH Worker authentication tests
        shell: pwsh
        run: node --test workers/ech-workers-cloudflare/src/auth.test.mjs

      - name: Run ECH helper tests
        shell: pwsh
        working-directory: upstreams/ech-workers
        run: go test ./...

      - name: Run aggregator regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s "upstreams/aggregator/tests" -p "test_*.py" -v

      - name: Install MiSub test dependencies
        shell: pwsh
        working-directory: upstreams/misub
        run: |
          npm ci

      - name: Run MiSub unit tests
        shell: pwsh
        working-directory: upstreams/misub
        run: |
          npm run test:run

      - name: Run all service/base Go tests
        shell: pwsh
        working-directory: service/base
        run: |
          go test -count=1 ./...

      - name: Run easyproxyctl Go tests
        shell: pwsh
        working-directory: tools/easyproxyctl
        run: |
          go test -count=1 ./...

  deploy-misub-pages:
    name: Deploy MiSub Pages
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ inputs.target == 'both' || inputs.target == 'misub-pages' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstreams/misub/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/easyproxyctl/go.mod
          cache-dependency-path: tools/easyproxyctl/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Assert MiSub deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MISUB_ADMIN_PASSWORD: ${{ secrets.MISUB_ADMIN_PASSWORD }}
          MISUB_COOKIE_SECRET: ${{ secrets.MISUB_COOKIE_SECRET }}
          MISUB_MANIFEST_TOKEN: ${{ secrets.MISUB_MANIFEST_TOKEN }}
          EASYPROXY_BACKUP_PASSPHRASE: ${{ secrets.EASYPROXY_BACKUP_PASSPHRASE }}
          MISUB_PUBLIC_URL: ${{ vars.EASYPROXY_MISUB_PUBLIC_URL }}
          MISUB_CALLBACK_URL: ${{ vars.EASYPROXY_MISUB_CALLBACK_URL }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MISUB_ADMIN_PASSWORD MISUB_COOKIE_SECRET MISUB_MANIFEST_TOKEN MISUB_PUBLIC_URL MISUB_CALLBACK_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for MiSub Pages deployment."
              exit 1
            fi
          done
          if [[ "$DEPLOYMENT_MODE" == "update" && -z "${EASYPROXY_BACKUP_PASSPHRASE:-}" ]]; then
            echo "::error::EASYPROXY_BACKUP_PASSPHRASE is required for a protected MiSub update."
            exit 1
          fi

      - name: Install deployment helpers
        run: python -m pip install PyYAML

      - name: Build easyproxyctl
        shell: bash
        working-directory: tools/easyproxyctl
        run: go build -o "${RUNNER_TEMP}/easyproxyctl" ./cmd/easyproxyctl

      - name: Install MiSub dependencies
        working-directory: upstreams/misub
        run: npm ci

      - name: Build MiSub
        working-directory: upstreams/misub
        run: npm run build

      - name: Resolve and attest MiSub Cloudflare resources
        id: misub_resources
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MISUB_PUBLIC_URL: ${{ vars.EASYPROXY_MISUB_PUBLIC_URL }}
          MISUB_CALLBACK_URL: ${{ vars.EASYPROXY_MISUB_CALLBACK_URL }}
          MISUB_D1_DATABASE_NAME: ${{ vars.EASYPROXY_MISUB_D1_DATABASE_NAME }}
          MISUB_D1_DATABASE_BINDING: ${{ vars.EASYPROXY_MISUB_D1_DATABASE_BINDING }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          INPUT_PROJECT_NAME: ${{ inputs.misub_project_name }}
          INPUT_BRANCH_NAME: ${{ inputs.misub_branch }}
        run: |
          set -euo pipefail
          mode="$DEPLOYMENT_MODE"
          project_name="$INPUT_PROJECT_NAME"
          branch_name="$INPUT_BRANCH_NAME"
          git check-ref-format "refs/heads/${branch_name}" >/dev/null || { echo "::error::Invalid MiSub branch name"; exit 1; }
          db_name="${MISUB_D1_DATABASE_NAME:-$project_name}"
          db_binding="${MISUB_D1_DATABASE_BINDING:-MISUB_DB}"
          topology_path="${RUNNER_TEMP}/topology.yaml"
          resource_state_path="${RUNNER_TEMP}/cloud-resources.json"
          runtime_config_path="${RUNNER_TEMP}/misub-wrangler.runtime.jsonc"
          manifest_path="${RUNNER_TEMP}/deployment-manifest.json"
          backup_path="${RUNNER_TEMP}/misub-before-update-${GITHUB_RUN_ID}.age"

          python scripts/materialize-cloud-topology.py \
            --base topology.example.yaml \
            --output "$topology_path" \
            --pages-project "$project_name" \
            --d1-database "$db_name"
          "${RUNNER_TEMP}/easyproxyctl" cloud "$mode" \
            --topology "$topology_path" \
            --state-output "$resource_state_path" \
            --wrangler-dir upstreams/misub \
            --production-branch "$branch_name"

          db_id="$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['d1']['id'])" "$resource_state_path")"
          pages_id="$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['pages']['id'])" "$resource_state_path")"
          deployment_name="$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['deployment_name'])" "$resource_state_path")"
          python "${GITHUB_WORKSPACE}/scripts/materialize-misub-wrangler.py" \
            --base-config "${GITHUB_WORKSPACE}/upstreams/misub/wrangler.jsonc" \
            --output "$runtime_config_path" \
            --project-name "$project_name" \
            --deployment-name "$deployment_name" \
            --public-url "${MISUB_PUBLIC_URL}" \
            --callback-url "${MISUB_CALLBACK_URL}" \
            --d1-binding "$db_binding" \
            --d1-database-name "$db_name" \
            --d1-database-id "$db_id"

          "${RUNNER_TEMP}/easyproxyctl" manifest build \
            --topology "$topology_path" \
            --output "$manifest_path" \
            --resource-id "pages=$pages_id" \
            --resource-id "d1=$db_id"
          "${RUNNER_TEMP}/easyproxyctl" cloud verify \
            --topology "$topology_path" \
            --manifest "$manifest_path" \
            --state-output "$resource_state_path" \
            --wrangler-config "$runtime_config_path" \
            --wrangler-dir upstreams/misub

          echo "project_name=$project_name" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
          echo "database_name=$db_name" >> "$GITHUB_OUTPUT"
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "topology_path=$topology_path" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "backup_path=$backup_path" >> "$GITHUB_OUTPUT"
          echo "runtime_config_path=$runtime_config_path" >> "$GITHUB_OUTPUT"

      - name: Create encrypted pre-update MiSub backup
        if: ${{ inputs.deployment_mode == 'update' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MISUB_ADMIN_PASSWORD: ${{ secrets.MISUB_ADMIN_PASSWORD }}
          EASYPROXY_BACKUP_PASSPHRASE: ${{ secrets.EASYPROXY_BACKUP_PASSPHRASE }}
          MISUB_PUBLIC_URL: ${{ vars.EASYPROXY_MISUB_PUBLIC_URL }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/easyproxyctl" cloud backup \
            --topology "${{ steps.misub_resources.outputs.topology_path }}" \
            --manifest "${{ steps.misub_resources.outputs.manifest_path }}" \
            --wrangler-config "${{ steps.misub_resources.outputs.runtime_config_path }}" \
            --wrangler-dir upstreams/misub \
            --base-url "$MISUB_PUBLIC_URL" \
            --allow-direct-d1-fallback \
            --output "${{ steps.misub_resources.outputs.backup_path }}"

      - name: Retain encrypted pre-update backup
        if: ${{ inputs.deployment_mode == 'update' }}
        uses: actions/upload-artifact@v4
        with:
          name: misub-before-update-${{ github.run_id }}
          path: ${{ steps.misub_resources.outputs.backup_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Apply runtime config and expand-only D1 migrations
        shell: bash
        working-directory: upstreams/misub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cp "${{ steps.misub_resources.outputs.runtime_config_path }}" wrangler.jsonc
          npx wrangler d1 migrations apply "${{ steps.misub_resources.outputs.database_name }}" --remote

      - name: Sync MiSub Pages secrets
        shell: bash
        working-directory: upstreams/misub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ steps.misub_resources.outputs.project_name }}
          MISUB_ADMIN_PASSWORD: ${{ secrets.MISUB_ADMIN_PASSWORD }}
          MISUB_COOKIE_SECRET: ${{ secrets.MISUB_COOKIE_SECRET }}
          MISUB_MANIFEST_TOKEN: ${{ secrets.MISUB_MANIFEST_TOKEN }}
        run: |
          set -euo pipefail
          printf "%s" "${MISUB_ADMIN_PASSWORD}" | npx wrangler pages secret put ADMIN_PASSWORD --project-name "$PROJECT_NAME"
          printf "%s" "${MISUB_COOKIE_SECRET}" | npx wrangler pages secret put COOKIE_SECRET --project-name "$PROJECT_NAME"
          printf "%s" "${MISUB_MANIFEST_TOKEN}" | npx wrangler pages secret put MANIFEST_TOKEN --project-name "$PROJECT_NAME"

      - name: Deploy MiSub Pages
        id: deploy_misub
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: upstreams/misub
          command: >-
            pages deploy dist
            --project-name=${{ steps.misub_resources.outputs.project_name }}
            --branch=${{ steps.misub_resources.outputs.branch_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify MiSub Pages deployment
        if: ${{ inputs.run_verification }}
        shell: bash
        env:
          MISUB_PUBLIC_URL: ${{ vars.EASYPROXY_MISUB_PUBLIC_URL }}
          MISUB_ADMIN_PASSWORD: ${{ secrets.MISUB_ADMIN_PASSWORD }}
          MISUB_MANIFEST_TOKEN: ${{ secrets.MISUB_MANIFEST_TOKEN }}
          MISUB_MANIFEST_PROFILE_ID: ${{ vars.EASYPROXY_MISUB_MANIFEST_PROFILE_ID }}
          DEPLOYED_PROJECT_NAME: ${{ steps.misub_resources.outputs.project_name }}
          DEPLOYED_BRANCH_NAME: ${{ steps.misub_resources.outputs.branch_name }}
          REQUESTED_BRANCH_NAME: ${{ inputs.misub_branch }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy_misub.outputs['pages-deployment-alias-url'] }}
          DEPLOYMENT_URL: ${{ steps.deploy_misub.outputs['deployment-url'] }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests PyYAML
          if [[ "$DEPLOYED_BRANCH_NAME" == "$REQUESTED_BRANCH_NAME" && "$DEPLOYED_BRANCH_NAME" == "main" ]]; then
            base_url="https://${DEPLOYED_PROJECT_NAME}.pages.dev"
          else
            base_url="$DEPLOYMENT_ALIAS_URL"
            if [[ -z "$base_url" ]]; then
              base_url="$DEPLOYMENT_URL"
            fi
            if [[ -z "$base_url" ]]; then
              base_url="${MISUB_PUBLIC_URL}"
            fi
          fi
          python scripts/verify-misub-deploy.py \
            --base-url "${base_url}" \
            --manifest-profile-id "${MISUB_MANIFEST_PROFILE_ID:-default}"

      - name: Retain MiSub deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: misub-deployment-manifest-${{ github.run_id }}
          path: ${{ steps.misub_resources.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 90

      - name: MiSub deploy summary
        shell: bash
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          PROJECT_NAME: ${{ steps.misub_resources.outputs.project_name }}
          BRANCH_NAME: ${{ steps.misub_resources.outputs.branch_name }}
          DATABASE_NAME: ${{ steps.misub_resources.outputs.database_name }}
          DATABASE_ID: ${{ steps.misub_resources.outputs.database_id }}
          DEPLOYMENT_URL: ${{ steps.deploy_misub.outputs['deployment-url'] }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy_misub.outputs['pages-deployment-alias-url'] }}
        run: |
          {
            echo "## MiSub Pages deploy completed"
            echo
            echo "- mode: \`${DEPLOYMENT_MODE}\`"
            echo "- project: \`${PROJECT_NAME}\`"
            echo "- branch: \`${BRANCH_NAME}\`"
            echo "- d1 database: \`${DATABASE_NAME}\`"
            echo "- d1 database id: \`${DATABASE_ID}\`"
            echo "- deployment url: \`${DEPLOYMENT_URL:-n/a}\`"
            echo "- preview alias: \`${DEPLOYMENT_ALIAS_URL:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-ech-workers-cloudflare:
    name: Deploy ech-workers-cloudflare
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ inputs.target == 'both' || inputs.target == 'ech-workers-cloudflare' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ECH verification dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests websockets

      - name: Assert Worker deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ECH_TOKEN: ${{ secrets.ECH_TOKEN }}
          ECH_WORKER_PUBLIC_URL: ${{ vars.EASYPROXY_ECH_WORKER_PUBLIC_URL }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ECH_TOKEN ECH_WORKER_PUBLIC_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for ech-workers-cloudflare deployment."
              exit 1
            fi
          done

      - name: Resolve exact Worker identity
        id: worker_identity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        run: |
          set -euo pipefail
          worker_name="$(python -c 'import json; print(json.load(open("workers/ech-workers-cloudflare/wrangler.jsonc", encoding="utf-8"))["name"])')"
          python scripts/verify-cloudflare-worker-identity.py \
            --account-id "${CLOUDFLARE_ACCOUNT_ID}" \
            --worker-name "${worker_name}" \
            --mode "${DEPLOYMENT_MODE}"
          echo "worker_name=${worker_name}" >> "$GITHUB_OUTPUT"

      - name: Prove update is not an implicit token rotation
        if: ${{ inputs.deployment_mode == 'update' }}
        shell: bash
        env:
          ECH_WORKER_PUBLIC_URL: ${{ vars.EASYPROXY_ECH_WORKER_PUBLIC_URL }}
          ECH_TOKEN: ${{ secrets.ECH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/verify-ech-worker-deploy.py --base-url "$ECH_WORKER_PUBLIC_URL"

      - name: Sync ech-workers-cloudflare secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ECH_TOKEN: ${{ secrets.ECH_TOKEN }}
        run: |
          set -euo pipefail
          printf "%s" "${ECH_TOKEN}" | npx wrangler secret put ECH_TOKEN --config workers/ech-workers-cloudflare/wrangler.jsonc

      - name: Deploy ech-workers-cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/ech-workers-cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify ech-workers-cloudflare deployment
        if: ${{ inputs.run_verification }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ECH_WORKER_PUBLIC_URL: ${{ vars.EASYPROXY_ECH_WORKER_PUBLIC_URL }}
          ECH_TOKEN: ${{ secrets.ECH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/verify-cloudflare-worker-identity.py \
            --account-id "${CLOUDFLARE_ACCOUNT_ID}" \
            --worker-name "${{ steps.worker_identity.outputs.worker_name }}" \
            --mode verify
          python scripts/verify-ech-worker-deploy.py --base-url "${ECH_WORKER_PUBLIC_URL}"

      - name: Worker deploy summary
        shell: bash
        run: |
          {
            echo "## ech-workers-cloudflare deploy completed"
            echo
            echo "- mode: \`${{ inputs.deployment_mode }}\`"
            echo "- worker config: \`workers/ech-workers-cloudflare/wrangler.jsonc\`"
            echo "- worker name: \`${{ steps.worker_identity.outputs.worker_name }}\`"
            echo "- public url: \`${{ vars.EASYPROXY_ECH_WORKER_PUBLIC_URL || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-aggregator-seed-relay:
    name: Deploy aggregator seed relay
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ inputs.target == 'both' || inputs.target == 'aggregator-seed-relay' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Assert relay deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ISSUE91_UPSTREAM_URL_B64: ${{ secrets.EASYPROXY_AGGREGATOR_ISSUE91_UPSTREAM_URL_B64 }}
          RELAY_URL: ${{ vars.EASYPROXY_AGGREGATOR_ISSUE91_RELAY_URL }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ISSUE91_UPSTREAM_URL_B64 RELAY_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for aggregator seed relay deployment."
              exit 1
            fi
          done

      - name: Sync relay upstream secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ISSUE91_UPSTREAM_URL_B64: ${{ secrets.EASYPROXY_AGGREGATOR_ISSUE91_UPSTREAM_URL_B64 }}
        run: |
          set -euo pipefail
          printf "%s" "${ISSUE91_UPSTREAM_URL_B64}" | npx wrangler secret put ISSUE91_UPSTREAM_URL_B64 --config workers/aggregator-seed-relay/wrangler.jsonc

      - name: Deploy aggregator seed relay
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/aggregator-seed-relay/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify aggregator seed relay deployment
        if: ${{ inputs.run_verification }}
        shell: bash
        env:
          RELAY_URL: ${{ vars.EASYPROXY_AGGREGATOR_ISSUE91_RELAY_URL }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests PyYAML
          python scripts/verify-aggregator-seed-relay.py --base-url "${RELAY_URL%/issue91}"

      - name: Relay deploy summary
        shell: bash
        run: |
          {
            echo "## aggregator seed relay deploy completed"
            echo
            echo "- mode: \`${{ inputs.deployment_mode }}\`"
            echo "- worker config: \`workers/aggregator-seed-relay/wrangler.jsonc\`"
            echo "- relay url: \`${{ vars.EASYPROXY_AGGREGATOR_ISSUE91_RELAY_URL || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-misub-ech-profile:
    name: Sync MiSub ECH connector profile
    runs-on: ubuntu-latest
    needs:
      - deploy-misub-pages
      - deploy-ech-workers-cloudflare
    if: >-
      ${{ always() && (
        (inputs.target == 'both' && needs.deploy-misub-pages.result == 'success' && needs.deploy-ech-workers-cloudflare.result == 'success') ||
        (inputs.target == 'misub-pages' && needs.deploy-misub-pages.result == 'success') ||
        (inputs.target == 'ech-workers-cloudflare' && needs.deploy-ech-workers-cloudflare.result == 'success')
      ) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Synchronize MiSub connector manifest profile
        shell: bash
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          AGGREGATOR_PUBLIC_BASE_URL: ${{ vars.EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL }}
          AGGREGATOR_EFFECTIVE_URL: ${{ vars.EASYPROXY_AGGREGATOR_EFFECTIVE_URL }}
          MISUB_PUBLIC_URL: ${{ vars.EASYPROXY_MISUB_PUBLIC_URL }}
          MISUB_ADDITIONAL_SUBSCRIPTIONS_JSON: ${{ vars.EASYPROXY_MISUB_ADDITIONAL_SUBSCRIPTIONS_JSON }}
          MISUB_ADMIN_PASSWORD: ${{ secrets.MISUB_ADMIN_PASSWORD }}
          MISUB_MANIFEST_TOKEN: ${{ secrets.MISUB_MANIFEST_TOKEN }}
          MISUB_CONNECTOR_PROFILE_ID: ${{ vars.EASYPROXY_MISUB_CONNECTOR_PROFILE_ID }}
          MISUB_MANIFEST_PROFILE_ID: ${{ vars.EASYPROXY_MISUB_MANIFEST_PROFILE_ID }}
          ECH_WORKER_PUBLIC_URL: ${{ vars.EASYPROXY_ECH_WORKER_PUBLIC_URL }}
          ECH_TOKEN: ${{ secrets.ECH_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests PyYAML

          if [[ -z "${MISUB_PUBLIC_URL:-}" || -z "${MISUB_ADMIN_PASSWORD:-}" || -z "${MISUB_MANIFEST_TOKEN:-}" || -z "${ECH_WORKER_PUBLIC_URL:-}" || -z "${ECH_TOKEN:-}" ]]; then
            echo "::error::MiSub profile sync requires MISUB_PUBLIC_URL, MISUB_ADMIN_PASSWORD, MISUB_MANIFEST_TOKEN, ECH_WORKER_PUBLIC_URL, and ECH_TOKEN."
            exit 1
          fi

          connector_profile_id="${MISUB_CONNECTOR_PROFILE_ID:-easyproxies-ech-runtime}"
          runtime_profile_id="${MISUB_MANIFEST_PROFILE_ID:-aggregator-global}"

          if ! python -c "import os, requests, sys; base=os.environ['MISUB_PUBLIC_URL'].rstrip('/') + '/'; response=requests.get(base, timeout=20); response.raise_for_status()"
          then
            if [[ "${DEPLOY_TARGET}" == "ech-workers-cloudflare" ]]; then
              echo "::warning::MiSub is not reachable yet; skipping connector profile sync during ech-workers-only deployment."
              exit 0
            fi
            echo "::error::MiSub public URL is not reachable, cannot synchronize connector profile."
            exit 1
          fi

          if [[ -z "${AGGREGATOR_PUBLIC_BASE_URL:-}" || -z "${AGGREGATOR_EFFECTIVE_URL:-}" ]]; then
            echo "::error::MiSub runtime source sync requires AGGREGATOR_PUBLIC_BASE_URL and AGGREGATOR_EFFECTIVE_URL."
            exit 1
          fi
          python scripts/verify-aggregator-stable.py \
            --base-url "${AGGREGATOR_PUBLIC_BASE_URL}" \
            --artifact-name public-effective \
            --expected-url "${AGGREGATOR_EFFECTIVE_URL}"

          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          command = [
              sys.executable,
              "scripts/sync-misub-runtime-sources.py",
              "--base-url", os.environ["MISUB_PUBLIC_URL"],
              "--profile-id", os.environ.get("MISUB_MANIFEST_PROFILE_ID", "aggregator-global"),
              "--profile-name", "Aggregator Global",
              "--subscription-url", os.environ["AGGREGATOR_EFFECTIVE_URL"],
          ]

          extras = json.loads(os.environ.get("MISUB_ADDITIONAL_SUBSCRIPTIONS_JSON") or "[]")
          if not isinstance(extras, list):
              raise SystemExit("MISUB_ADDITIONAL_SUBSCRIPTIONS_JSON must be a JSON array")
          for item in extras:
              value = str(item or "").strip()
              if value:
                  command.extend(["--subscription-url", value])

          completed = subprocess.run(command, check=False)
          raise SystemExit(completed.returncode)
          PY

          python scripts/sync-misub-ech-profile.py \
            --base-url "${MISUB_PUBLIC_URL}" \
            --profile-id "${connector_profile_id}" \
            --legacy-profile-id "easyproxies-ech-test" \
            --remove-profile-id "easyproxies-ech-preferred" \
            --profile-name "EasyProxies ECH Runtime" \
            --profile-description "Private profile for routing EasyProxy-managed ECH connector sources through the current self-hosted ECH Worker; host-local preferred IP fanout is generated on each EasyProxy runtime independently." \
            --attach-profile-id "${runtime_profile_id}" \
            --worker-url "${ECH_WORKER_PUBLIC_URL}:443"

      - name: MiSub connector profile sync summary
        shell: bash
        run: |
          {
            echo "## MiSub ECH connector profile synchronized"
            echo
            echo "- runtime profile id: \`${{ vars.EASYPROXY_MISUB_CONNECTOR_PROFILE_ID || 'easyproxies-ech-runtime' }}\`"
            echo "- MiSub base URL: \`${{ vars.EASYPROXY_MISUB_PUBLIC_URL || 'n/a' }}\`"
            echo "- ECH worker URL: \`${{ vars.EASYPROXY_ECH_WORKER_PUBLIC_URL || 'n/a' }}:443\`"
            echo "- preferred IP fanout: generated per-host by EasyProxy; not published through MiSub"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy Aggregator

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

'on':
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Native deployment mode
        required: true
        default: update
        type: choice
        options:
          - bootstrap
          - update
      force_deploy:
        description: Run even if no recent repository changes are present
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: easyproxy-aggregator-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Aggregator native preflight
    if: ${{ github.event_name != 'schedule' || vars.EASYPROXY_AGGREGATOR_ENABLE_SCHEDULE == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: service/base/go.mod
          cache-dependency-path: service/base/go.sum

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run root script smoke tests
        shell: pwsh
        run: |
          python -m pytest -q tests

      - name: Run aggregator regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s "upstreams/aggregator/tests" -p "test_*.py" -v

      - name: Run all service/base Go tests
        shell: pwsh
        working-directory: service/base
        run: |
          go test -count=1 ./...

  deploy:
    name: Run native aggregator publish
    if: ${{ github.event_name != 'schedule' || vars.EASYPROXY_AGGREGATOR_ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ secrets.EASYPROXY_AGGREGATOR_GH_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.EASYPROXY_AGGREGATOR_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.EASYPROXY_AGGREGATOR_R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.EASYPROXY_AGGREGATOR_R2_ACCOUNT_ID }}
      SKIP_ALIVE_CHECK: ${{ vars.EASYPROXY_AGGREGATOR_SKIP_ALIVE_CHECK }}
      SKIP_REMARK: ${{ vars.EASYPROXY_AGGREGATOR_SKIP_REMARK }}
      REACHABLE: ${{ vars.EASYPROXY_AGGREGATOR_REACHABLE }}
      ENABLE_SPECIAL_PROTOCOLS: ${{ vars.EASYPROXY_AGGREGATOR_ENABLE_SPECIAL_PROTOCOLS }}
      LOG_LEVEL_DEBUG: ${{ vars.EASYPROXY_AGGREGATOR_LOG_LEVEL_DEBUG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install aggregator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r upstreams/aggregator/requirements.txt requests boto3 PyYAML curl_cffi

      - name: Resolve deployment mode
        id: deploy_mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.deployment_mode }}"
            force_deploy="${{ inputs.force_deploy }}"
          else
            mode="update"
            force_deploy="false"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "force_deploy=${force_deploy}" >> "${GITHUB_OUTPUT}"

      - name: Detect relevant changes
        id: change_gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "schedule" || "${{ steps.deploy_mode.outputs.force_deploy }}" == "true" ]]; then
            {
              echo "should_deploy=true"
              echo "reason=manual_schedule_or_forced"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t matched_files < <(
            git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" -- \
              upstreams/aggregator \
              deploy/upstreams/aggregator \
              scripts/deploy-aggregator.ps1 \
              scripts/materialize-aggregator-config.py \
              scripts/materialize-aggregator-release.py \
              scripts/promote-aggregator-release.py \
              scripts/verify-aggregator-publish.py \
              .github/workflows/deploy-aggregator.yml
          )

          if [[ "${#matched_files[@]}" -eq 0 ]]; then
            {
              echo "should_deploy=false"
              echo "reason=no_relevant_changes"
              echo "matched_files<<EOF"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "should_deploy=true"
            echo "reason=relevant_changes_detected"
            echo "matched_files<<EOF"
            printf '%s\n' "${matched_files[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Skip deployment summary
        if: steps.change_gate.outputs.should_deploy != 'true'
        shell: bash
        run: |
          {
            echo "## Aggregator deploy"
            echo
            echo "- Result: skipped"
            echo "- Reason: \`${{ steps.change_gate.outputs.reason }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate native aggregator secrets
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in GH_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is required for native aggregator deployment."
              exit 1
            fi
          done

      - name: Materialize runtime config
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        env:
          EASYPROXY_AGGREGATOR_SHARED_TOKEN: ${{ secrets.EASYPROXY_AGGREGATOR_SHARED_TOKEN }}
          EASYPROXY_AGGREGATOR_ISSUE91_SUB_URL_B64: ${{ secrets.EASYPROXY_AGGREGATOR_ISSUE91_SUB_URL_B64 }}
        run: |
          set -euo pipefail
          python scripts/materialize-aggregator-config.py \
            --template deploy/upstreams/aggregator/config/config.actions.r2.json \
            --output upstreams/aggregator/subscribe/config/config.actions.base.runtime.json

      - name: Prepare isolated candidate release
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          plan_path="${RUNNER_TEMP}/aggregator-publication-plan.json"
          manifest_path="${RUNNER_TEMP}/aggregator-stable-manifest.json"
          python scripts/materialize-aggregator-release.py \
            --runtime-config upstreams/aggregator/subscribe/config/config.actions.base.runtime.json \
            --run-id "${release_id}" \
            --output-runtime-config upstreams/aggregator/subscribe/config/config.actions.runtime.json \
            --output-plan "${plan_path}"
          {
            echo "EASYPROXY_AGGREGATOR_RELEASE_ID=${release_id}"
            echo "EASYPROXY_AGGREGATOR_PUBLICATION_PLAN=${plan_path}"
            echo "EASYPROXY_AGGREGATOR_STABLE_MANIFEST=${manifest_path}"
          } >> "${GITHUB_ENV}"

      - name: Prefetch Issue #91 shared seed
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        env:
          EASYPROXY_AGGREGATOR_ISSUE91_UPSTREAM_URL_B64: ${{ secrets.EASYPROXY_AGGREGATOR_ISSUE91_UPSTREAM_URL_B64 }}
        run: |
          set -euo pipefail
          python scripts/prefetch-aggregator-issue91.py \
            --runtime-config upstreams/aggregator/subscribe/config/config.actions.runtime.json \
            --output upstreams/aggregator/subscribe/config/issue91.shared.yaml

      - name: Run aggregator publish
        if: steps.change_gate.outputs.should_deploy == 'true'
        working-directory: upstreams/aggregator
        shell: bash
        run: |
          set -euo pipefail
          python -u subscribe/process.py --overwrite -s subscribe/config/config.actions.runtime.json

      - name: Verify candidate core artifacts
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        env:
          EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL: ${{ vars.EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL:-}" ]]; then
            echo "::error::EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL is required for candidate verification and safe promotion."
            exit 1
          fi
          python scripts/verify-aggregator-publish.py \
            --base-url "${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL}" \
            --runtime-config upstreams/aggregator/subscribe/config/config.actions.runtime.json

      - name: Audit shared effective aggregator nodes
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: pwsh
        env:
          EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL: ${{ vars.EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL }}
        run: |
          $baseUrl = $env:EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL
          if ([string]::IsNullOrWhiteSpace($baseUrl)) {
            throw "EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL is required for aggregator effective audit."
          }
          $summaryPath = Join-Path $env:RUNNER_TEMP "aggregator-effective-summary.json"
          python ./scripts/easyproxy_source_audit.py `
            --audit-id "aggregator-effective-${{ github.run_id }}" `
            --subscription "$baseUrl/candidate/$env:EASYPROXY_AGGREGATOR_RELEASE_ID/subs/clash.yaml" `
            --output-path $summaryPath `
            --docker-network-name "EasyAiMi" `
            --keep-artifacts
          "EASYPROXY_AGGREGATOR_EFFECTIVE_AUDIT_SUMMARY=$summaryPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish effective aggregator artifact
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish-aggregator-effective.py \
            --runtime-config upstreams/aggregator/subscribe/config/config.actions.runtime.json \
            --audit-summary "${EASYPROXY_AGGREGATOR_EFFECTIVE_AUDIT_SUMMARY}"

      - name: Verify complete candidate release
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        env:
          EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL: ${{ vars.EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          python scripts/verify-aggregator-publish.py \
            --base-url "${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL}" \
            --runtime-config upstreams/aggregator/subscribe/config/config.actions.runtime.json \
            --require-all

      - name: Promote candidate to stable with last-known-good recovery
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        env:
          EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL: ${{ vars.EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL }}
          MIN_STABLE_NODES: ${{ vars.EASYPROXY_AGGREGATOR_MIN_STABLE_NODES }}
          MIN_SOURCE_COUNT: ${{ vars.EASYPROXY_AGGREGATOR_MIN_SOURCE_COUNT }}
          MAX_NODE_DROP_RATIO: ${{ vars.EASYPROXY_AGGREGATOR_MAX_NODE_DROP_RATIO }}
          MAX_SOURCE_DROP_RATIO: ${{ vars.EASYPROXY_AGGREGATOR_MAX_SOURCE_DROP_RATIO }}
        run: |
          set -euo pipefail
          aggregator_commit="$(git -C upstreams/aggregator rev-parse HEAD)"
          python scripts/promote-aggregator-release.py \
            --plan "${EASYPROXY_AGGREGATOR_PUBLICATION_PLAN}" \
            --audit-summary "${EASYPROXY_AGGREGATOR_EFFECTIVE_AUDIT_SUMMARY}" \
            --public-base-url "${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL}" \
            --root-commit "${GITHUB_SHA}" \
            --aggregator-commit "${aggregator_commit}" \
            --min-nodes "${MIN_STABLE_NODES:-1}" \
            --min-sources "${MIN_SOURCE_COUNT:-1}" \
            --max-node-drop-ratio "${MAX_NODE_DROP_RATIO:-0.60}" \
            --max-source-drop-ratio "${MAX_SOURCE_DROP_RATIO:-0.80}" \
            --output "${EASYPROXY_AGGREGATOR_STABLE_MANIFEST}"

      - name: Re-verify canonical stable artifacts
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        env:
          EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL: ${{ vars.EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL }}
          EASYPROXY_AGGREGATOR_EFFECTIVE_URL: ${{ vars.EASYPROXY_AGGREGATOR_EFFECTIVE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${EASYPROXY_AGGREGATOR_EFFECTIVE_URL:-}" ]]; then
            echo "::error::EASYPROXY_AGGREGATOR_EFFECTIVE_URL must point at the canonical stable effective artifact."
            exit 1
          fi
          python scripts/verify-aggregator-publish.py \
            --base-url "${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL}" \
            --runtime-config upstreams/aggregator/subscribe/config/config.actions.base.runtime.json \
            --require-all
          python scripts/verify-aggregator-stable.py \
            --base-url "${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL}" \
            --artifact-name public-effective \
            --expected-url "${EASYPROXY_AGGREGATOR_EFFECTIVE_URL}"

      - name: Upload aggregator workflow log
        if: always() && steps.change_gate.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aggregator-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            upstreams/aggregator/workflow.log
            ${{ runner.temp }}/aggregator-publication-plan.json
            ${{ runner.temp }}/aggregator-effective-summary.json
            ${{ runner.temp }}/aggregator-stable-manifest.json
          if-no-files-found: ignore

      - name: Write deployment summary
        if: steps.change_gate.outputs.should_deploy == 'true'
        shell: bash
        env:
          EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL: ${{ vars.EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL }}
        run: |
          {
            echo "## Aggregator deploy completed"
            echo
            echo "- mode: \`${{ steps.deploy_mode.outputs.mode }}\`"
            echo "- verification: mandatory candidate, promotion, and stable gates passed"
            echo "- public base url: \`${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL:-n/a}\`"
            echo "- release id: \`${EASYPROXY_AGGREGATOR_RELEASE_ID}\`"
            echo "- immutable manifest: \`${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL%/}/releases/${EASYPROXY_AGGREGATOR_RELEASE_ID}/manifest.json\`"
            echo "- stable manifest: \`${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL%/}/manifests/stable.json\`"
            echo "- last-known-good manifest: \`${EASYPROXY_AGGREGATOR_PUBLIC_BASE_URL%/}/last-known-good/manifest.json\`"
            echo "- reason: \`${{ steps.change_gate.outputs.reason }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

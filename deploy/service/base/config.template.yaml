# EasyProxy monorepo deployment template.
# This template follows the current EasyProxy config schema.
# The migrated real runtime config lives in config.yaml (git-ignored).
# Default ports are intentionally shifted away from the legacy source
# deployment so both stacks can run side-by-side during migration.

mode: hybrid
log_level: info
skip_cert_verify: false
database_path: /var/lib/easyproxy/data/data.db

# Proxy destinations use encrypted DNS through the proxy pool. Upstream node
# server names are resolved by the local resolver to avoid a DNS dependency
# cycle while still avoiding polluted system DNS for final destinations.
dns:
  enabled: true
  remote_servers:
    - https://cloudflare-dns.com/dns-query
  detour: proxy-pool
  strategy: prefer_ipv4

listener:
  address: 0.0.0.0
  port: 22323
  protocol: http
  username: ""
  password: ""

pool:
  mode: auto
  failure_threshold: 3
  blacklist_duration: 24h
  detour_source_refs: []

multi_port:
  address: 0.0.0.0
  base_port: 25000
  protocol: http
  username: ""
  password: ""

# Smart routing is opt-in. With listen left empty, route A reuses the normal
# listener port, so the existing Docker 22323 publication remains sufficient.
# A custom listen value is route B and requires an additional Docker port bind.
routing:
  enabled: false
  listen: ""
  default_strategy: stable # Prefer long-lived nodes; fall back to any healthy node.
  use_default_rules: true
  final_policy: PROXY
  rules: []
  rule_files: []
  rule_providers: []
  long_lived:
    min_uptime: 2h
    min_success_rate: 0.9
  session:
    ttl: 10m

# Provider-neutral gateway. Keep disabled for ordinary proxy deployments.
gateway:
  enabled: false
  mode: tun
  listen: 0.0.0.0:15001
  ingress:
    interfaces: []
    interface_patterns: []
    trusted_cidrs: []
  capture:
    tcp: disabled
    udp: disabled
    preserve_original_destination: true
  routing:
    final_policy: PROXY
    no_available_proxy_policy: DIRECT
  dns:
    enabled: true
    listen: 0.0.0.0:53
  tun:
    interface_name: easyproxy0
    addresses: [172.31.255.1/30, "fd31:255::1/126"]
    stack: mixed
    mtu: 1500
    ipv4: true
    ipv6: true
    udp: true
    strict_route: true
    dns_hijack: true
    fake_ip: true
    fake_ipv4_range: 198.18.0.0/16
    fake_ipv6_range: "fc00::/18"
  devices: {}

# Canonical Local Server is opt-in. Enabling it requires mode: pool and a
# listener.protocol of mixed. The management API and WebUI persist runtime
# changes in the deployed config; topology tooling never overwrites this file.
local_server:
  enabled: false
  listen: ""
  auth:
    username: easyproxy
    password: change_me_to_a_strong_shared_password

management:
  enabled: true
  # Binding outside loopback requires a non-empty management password. When
  # Local Server is enabled, its canonical auth pair supplies that password.
  listen: 127.0.0.1:29888
  probe_targets:
    - "https://connectivitycheck.gstatic.com/generate_204"
    - "https://cp.cloudflare.com/generate_204"
    - "https://www.msftconnecttest.com/connecttest.txt"
    - "https://www.google.com/generate_204"
  password: ""

subscription_refresh:
  enabled: true
  interval: 24h0m0s
  timeout: 30s
  health_check_timeout: 2m0s
  drain_timeout: 30s
  min_available_nodes: 1

geoip:
  enabled: true
  database_path: "/var/lib/easyproxy/GeoLite2-Country.mmdb"
  auto_update_enabled: true
  auto_update_interval: 24h0m0s

source_sync:
  enabled: false
  manifest_url: "https://your-misub-domain.example.com/api/manifest/your-profile"
  manifest_token: ""
  refresh_interval: 1h0m0s
  request_timeout: 15s
  default_direct_proxy_scheme: http
  fallback_subscriptions:
    - "https://sub.example.com/subs/effective.txt"
  connector_runtime:
    enabled: true
    binary_path: "/usr/local/bin/ech-workers"
    working_directory: "/var/lib/easyproxy/connectors"
    listen_host: "127.0.0.1"
    listen_start_port: 30000
    startup_timeout: 10s
    preferred_ip:
      binary_path: "/usr/local/bin/cfst"
      ip_file_path: "/usr/share/easyproxy/cfst/ip.txt"
      working_directory: "/var/lib/easyproxy/connectors/preferred-ip"
      timeout: 5m0s

connectors:
  - name: "ECH Worker Template"
    input: "https://your-ech-worker.example.com:443"
    enabled: false
    template_only: true
    group: "ECH Connectors"
    notes: "Local template for generating preferred Cloudflare entry IP connectors"
    connector_type: "ech_worker"
    connector_config:
      local_protocol: "socks5"
      access_token: ""

subscriptions: []

# Notes:
# - management.password is also accepted directly as an Authorization header
#   by the management API for service-to-service calls.
# - Add real subscription URLs or a MiSub manifest before enabling source_sync.
# - source_sync only augments runtime sources; local subscriptions and manual
#   direct proxies remain local-first and take precedence over manifest/fallback.
# - connector_runtime controls local execution of manifest connectors such as
#   `ech_worker`; these are materialized into local `http://` or `socks5://`
#   upstreams at refresh time.
# - local `connectors` are also supported now. They are managed at the local
#   EasyProxy layer and can be refreshed into preferred-IP variants without
#   writing back to MiSub.
# - If you prefer file-based nodes, replace subscriptions with nodes_file and
#   mount the corresponding file in docker-compose.yaml.

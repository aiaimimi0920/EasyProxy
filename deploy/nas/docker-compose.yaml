services:
  easy-proxy:
    image: ${EASY_PROXY_IMAGE:?Set EASY_PROXY_IMAGE to a version tag or digest}
    container_name: ${EASY_PROXY_CONTAINER_NAME:-easy-proxy}
    user: "${EASY_PROXY_UID:-10001}:${EASY_PROXY_GID:-10001}"
    restart: unless-stopped
    ports:
      - "${EASY_PROXY_POOL_BINDING:-22323:22323}"
      - "${EASY_PROXY_MANAGEMENT_BINDING:-29888:29888}"
    volumes:
      - ${EASY_PROXY_STATE_PATH:-./runtime/data}:/var/lib/easyproxy
      - ${EASY_PROXY_CONFIG_PATH:-./runtime/config.yaml}:/var/lib/easyproxy/config/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\", 29888), 5); s.close()'"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - easyproxy-nas

networks:
  easyproxy-nas:
    driver: bridge
